name: Build Maytrix Menu

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore compile-only references
        run: dotnet restore MaytrixMenu.sln -p:UseLocalGameAssemblies=false

      - name: Build menu
        run: dotnet build MaytrixMenu.sln -c Release --no-restore -p:UseLocalGameAssemblies=false -p:ContinuousIntegrationBuild=true -p:TreatWarningsAsErrors=true

      - name: Verify formatting
        run: dotnet format MaytrixMenu.sln --verify-no-changes --no-restore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Maytrix-Menu
          path: bin/Release/netstandard2.1/Maytrix-Menu.dll
          if-no-files-found: error
